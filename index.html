<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c18" media="(prefers-color-scheme: dark)" />
    <title>Flex Learn — Tự học tiếng Anh</title>
    <meta name="description" content="Tự học tiếng Anh cho giao tiếp hằng ngày và TOEIC: flashcard SRS, luyện chính tả, mẫu câu giao tiếp và tra cứu từ." />
    <meta property="og:title" content="Flex Learn — Tự học tiếng Anh" />
    <meta property="og:description" content="Flashcard SRS, luyện chính tả, giao tiếp hằng ngày và từ vựng TOEIC." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var b = Number(localStorage.getItem('flex_brightness'));
        if (b >= 60 && b <= 130 && b !== 100) document.documentElement.style.filter = 'brightness(' + b / 100 + ')';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
